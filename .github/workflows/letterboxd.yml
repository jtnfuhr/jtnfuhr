name: Latest Letterboxd Activity
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme-with-movies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Update README with styled Letterboxd posters
        run: python3 .github/scripts/update_letterboxd.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@://github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "Update Letterboxd movies"
          git push
